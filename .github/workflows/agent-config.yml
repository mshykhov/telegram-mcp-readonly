name: Agent Configuration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: read

concurrency:
  group: agent-config-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install agent configuration dependencies
        run: npm ci

      - name: Check agent configuration
        run: npm run rulesync:verify

      - name: Verify Renovate artifact updates
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'renovate[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for attempt in {1..12}; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$PR_HEAD_SHA/status" \
              --jq '[.statuses[] | select(.context == "renovate/artifacts")][0].state // "missing"')
            case "$state" in
              success) exit 0 ;;
              failure|error) echo "Renovate failed to update dependency artifacts."; exit 1 ;;
            esac
            sleep 10
          done
          echo "Renovate did not report a successful artifact update."
          exit 1
